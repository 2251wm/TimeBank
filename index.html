<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Bank 信用卡</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 16px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 20px; font-weight: bold; color: #10b981; }
        .sub-title { font-size: 12px; color: #94a3b8; }
        .btn-reset { background: none; border: none; color: #64748b; font-size: 12px; cursor: pointer; }
        
        /* 信用卡樣式 */
        .card { border-radius: 16px; padding: 24px; margin-bottom: 20px; transition: all 0.3s ease; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
        .card-credit { background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); border: 1px solid #065f46; }
        .card-debt { background: linear-gradient(135deg, #7f1d1d 0%, #451a03 100%); border: 1px solid #991b1b; }
        .card-top { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .card-label { font-size: 11px; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; }
        .card-status { font-size: 12px; font-weight: bold; margin-top: 4px; }
        .status-ok { color: #34d399; }
        .status-debt { color: #f87171; }
        .card-balance { font-size: 40px; font-weight: 800; }
        .card-unit { font-size: 14px; color: #94a3b8; margin-left: 4px; }
        .card-footer { display: flex; justify-content: space-between; margin-top: 20px; font-size: 11px; font-family: monospace; color: #94a3b8; }
        
        /* 切換按鈕 */
        .tab-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .tab-btn { padding: 12px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; }
        .tab-active-dep { background-color: #059669; color: white; }
        .tab-active-with { background-color: #e11d48; color: white; }
        .tab-inactive { background-color: #1e293b; color: #94a3b8; border: 1px solid #334155; }
        
        /* 表單與面板 */
        .panel { background-color: rgba(30, 41, 59, 0.8); border: 1px solid #334155; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
        .panel-title { font-size: 13px; font-weight: bold; margin-bottom: 10px; color: #cbd5e1; }
        .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
        input[type="number"], input[type="file"] { width: 100%; background-color: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; font-size: 14px; outline: none; }
        input[type="number"]:focus { border-color: #10b981; }
        .btn-action { padding: 10px 16px; border-radius: 8px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; whitespace-nowrap: nowrap; }
        .btn-dep { background-color: #059669; color: white; }
        .btn-with { background-color: #e11d48; color: white; }
        .quick-btns { display: flex; gap: 8px; }
        .btn-quick { background-color: #334155; border: 1px solid #475569; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; flex: 1; }
        
        /* 明細列表 */
        .history-title { font-size: 12px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
        .history-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.5); padding: 10px; border-radius: 8px; border: 1px solid #334155; font-size: 12px; }
        .item-dep { color: #34d399; font-weight: bold; }
        .item-with { color: #f87171; font-weight: bold; }
        .item-time { font-size: 10px; color: #64748b; margin-top: 2px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>💳 時間銀行 Time Bank</h1>
            <div class="sub-title">自律遊戲化 5:1 額度管理</div>
        </div>
        <button onclick="resetData()" class="btn-reset">重設資料</button>
    </header>

    <!-- 信用卡卡片 -->
    <div id="card" class="card card-credit">
        <div class="card-top">
            <div>
                <div class="card-label">Time Credit Balance</div>
                <div id="cardStatus" class="card-status status-ok">● 額度正常 (SOLVENT)</div>
            </div>
        </div>
        <div>
            <div class="card-label" style="margin-bottom: 4px;">可用娛樂額度 / 透支負債</div>
            <div>
                <span id="balanceDisplay" class="card-balance">0</span>
                <span class="card-unit">分鐘</span>
            </div>
        </div>
        <div class="card-footer">
            <div>RATIO: 5 : 1 (20%)</div>
            <div id="accountStatus">STATUS: OK</div>
        </div>
    </div>

    <!-- 頁籤按鈕 -->
    <div class="tab-group">
        <button id="btnTabDep" onclick="showTab('deposit')" class="tab-btn tab-active-dep">➕ 專注儲值 (存款)</button>
        <button id="btnTabWith" onclick="showTab('withdraw')" class="tab-btn tab-inactive">➖ 娛樂消費 (扣款)</button>
    </div>

    <!-- 面板 1：存款 -->
    <div id="panelDeposit">
        <div class="panel">
            <div class="panel-title">📁 匯入番茄鐘 CSV / Excel 報表</div>
            <input type="file" id="csvFileInput" accept="*/*" onchange="handleFileUpload(event)">
        </div>

        <div class="panel">
            <div class="panel-title">✍️ 手動輸入專注時間</div>
            <div class="input-group">
                <input type="number" id="focusInput" placeholder="例如：180 (分鐘)">
                <button onclick="addFocusManual()" class="btn-action btn-dep">換算儲值</button>
            </div>
            <div class="quick-btns">
                <button onclick="quickAddFocus(30)" class="btn-quick">+30 分鐘</button>
                <button onclick="quickAddFocus(60)" class="btn-quick">+1 小時</button>
                <button onclick="quickAddFocus(180)" class="btn-quick">+3 小時 (換36m)</button>
            </div>
        </div>
    </div>

    <!-- 面板 2：扣款 -->
    <div id="panelWithdraw" class="hidden">
        <div class="panel">
            <div class="panel-title">🎬 輸入使用娛樂 App 的總分鐘數</div>
            <div class="input-group">
                <input type="number" id="entertainmentInput" placeholder="例如：45 (分鐘)">
                <button onclick="addEntertainmentManual()" class="btn-action btn-with">進行扣除</button>
            </div>
            <div class="quick-btns">
                <button onclick="quickAddEnt(15)" class="btn-quick">-15 分鐘</button>
                <button onclick="quickAddEnt(30)" class="btn-quick">-30 分鐘</button>
                <button onclick="quickAddEnt(60)" class="btn-quick">-1 小時</button>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄 -->
    <div>
        <div class="history-title">交易帳單明細</div>
        <div id="historyList" class="history-list"></div>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('tb_balance')) || 0;
        let history = JSON.parse(localStorage.getItem('tb_history')) || [];

        function updateUI() {
            const balanceDisplay = document.getElementById('balanceDisplay');
            const card = document.getElementById('card');
            const cardStatus = document.getElementById('cardStatus');
            const accountStatus = document.getElementById('accountStatus');

            if (balanceDisplay) balanceDisplay.innerText = balance;
            
            if (card) {
                if (balance < 0) {
                    card.className = "card card-debt";
                    cardStatus.innerText = "● 信用透支中 (OVERDRAFT)";
                    cardStatus.className = "card-status status-debt";
                    accountStatus.innerText = "STATUS: DEBT";
                } else {
                    card.className = "card card-credit";
                    cardStatus.innerText = "● 額度正常 (SOLVENT)";
                    cardStatus.className = "card-status status-ok";
                    accountStatus.innerText = "STATUS: OK";
                }
            }

            localStorage.setItem('tb_balance', balance);
            localStorage.setItem('tb_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (!list) return;
            if (history.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#64748b; padding:12px; font-size:12px;">暫無交易紀錄</div>';
                return;
            }
            list.innerHTML = history.slice().reverse().map(item => `
                <div class="history-item">
                    <div>
                        <div class="${item.type === 'deposit' ? 'item-dep' : 'item-with'}">${item.desc}</div>
                        <div class="item-time">${item.time}</div>
                    </div>
                    <div class="${item.type === 'deposit' ? 'item-dep' : 'item-with'}">
                        ${item.type === 'deposit' ? '+' : '-'}${item.amount} m
                    </div>
                </div>
            `).join('');
        }

        function addFocusManual() {
            const input = document.getElementById('focusInput');
            const val = parseInt(input.value);
            if (isNaN(val) || val <= 0) {
                alert('請先在框內輸入有效的數字（分鐘數）！');
                return;
            }
            const earned = Math.floor(val / 5);
            balance += earned;
            history.push({
                type: 'deposit',
                desc: `專注 ${val} 分鐘 (換算儲值)`,
                amount: earned,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
            input.value = '';
            updateUI();
        }

        function quickAddFocus(mins) {
            document.getElementById('focusInput').value = mins;
            addFocusManual();
        }

        function addEntertainmentManual() {
            const input = document.getElementById('entertainmentInput');
            const val = parseInt(input.value);
            if (isNaN(val) || val <= 0) {
                alert('請先在框內輸入有效的數字（分鐘數）！');
                return;
            }
            balance -= val;
            history.push({
                type: 'withdraw',
                desc: `娛樂消費`,
                amount: val,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
            input.value = '';
            updateUI();
        }

        function quickAddEnt(mins) {
            document.getElementById('entertainmentInput').value = mins;
            addEntertainmentManual();
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const text = evt.target.result;
                const numbers = text.match(/\d+/g);
                if (numbers && numbers.length > 0) {
                    let totalMins = 0;
                    numbers.forEach(n => {
                        let num = parseInt(n);
                        if (num > 0 && num < 1440) totalMins += num;
                    });
                    if (totalMins > 0) {
                        const earned = Math.floor(totalMins / 5);
                        balance += earned;
                        history.push({
                            type: 'deposit',
                            desc: `匯入報表專注 ${totalMins} 分鐘`,
                            amount: earned,
                            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                        });
                        alert(`成功匯入報表！解析共 ${totalMins} 分鐘專注，已按 5:1 自動儲值 ${earned} 分鐘。`);
                        updateUI();
                    }
                } else {
                    alert('無法從檔案中讀取到時間數字，請直接使用手動輸入！');
                }
            };
            reader.readAsText(file);
        }

        function showTab(type) {
            const pDep = document.getElementById('panelDeposit');
            const pWith = document.getElementById('panelWithdraw');
            const btnDep = document.getElementById('btnTabDep');
            const btnWith = document.getElementById('btnTabWith');

            if (type === 'deposit') {
                pDep.classList.remove('hidden');
                pWith.classList.add('hidden');
                btnDep.className = "tab-btn tab-active-dep";
                btnWith.className = "tab-btn tab-inactive";
            } else {
                pDep.classList.add('hidden');
                pWith.classList.remove('hidden');
                btnWith.className = "tab-btn tab-active-with";
                btnDep.className = "tab-btn tab-inactive";
            }
        }

        function resetData() {
            if (confirm("確定要清空並重設所有紀錄嗎？")) {
                balance = 0;
                history = [];
                updateUI();
            }
        }

        // 初始化載入 UI
        window.onload = function() {
            updateUI();
        };
    </script>
</body>
</html>
