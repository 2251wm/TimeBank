<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Bank 信用卡</title>
    <!-- PWA Settings for Fullscreen App mode -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; }
        .card-gradient { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid #334155; }
        .debt-gradient { background: linear-gradient(135deg, #451a03 0%, #7f1d1d 100%); border: 1px solid #991b1b; }
        .credit-gradient { background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); border: 1px solid #065f46; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

    <div>
        <!-- 頂部標題 -->
        <header class="flex justify-between items-center my-4">
            <div>
                <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-credit-card text-emerald-400"></i> 時間銀行 Time Bank
                </h1>
                <p class="text-xs text-slate-400">自律遊戲化 5:1 額度管理</p>
            </div>
            <button onclick="resetData()" class="text-xs text-slate-500 hover:text-slate-300">重設資料</button>
        </header>

        <!-- 時間信用卡展示區 -->
        <div id="creditCard" class="card-gradient rounded-2xl p-6 shadow-2xl relative overflow-hidden transition-all duration-500 mb-6">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <span class="text-xs tracking-widest text-slate-400 uppercase font-semibold">Time Credit Balance</span>
                    <h2 id="balanceStatus" class="text-xs font-semibold text-emerald-400 mt-1">● 額度正常</h2>
                </div>
                <i class="fa-solid fa-wifi text-slate-600 text-lg"></i>
            </div>

            <div class="my-4">
                <div class="text-xs text-slate-400 mb-1">可用娛樂額度 / 透支負債</div>
                <div class="flex items-baseline gap-2">
                    <span id="balanceDisplay" class="text-4xl font-extrabold tracking-tight">0</span>
                    <span class="text-sm font-medium text-slate-400">分鐘</span>
                </div>
            </div>

            <div class="flex justify-between items-end mt-6 text-xs text-slate-400 font-mono">
                <div>
                    <div>CONVERSION RATIO</div>
                    <div class="text-slate-200 font-bold">5 : 1 (20%)</div>
                </div>
                <div class="text-right">
                    <div>ACCOUNT STATUS</div>
                    <div id="accountStatusText" class="text-emerald-400 font-bold">SOLVENT</div>
                </div>
            </div>
        </div>

        <!-- 功能分頁按鈕 -->
        <div class="grid grid-cols-2 gap-2 mb-6">
            <button onclick="showTab('deposit')" id="tabDeposit" class="py-2.5 rounded-xl font-medium text-sm flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-lg">
                <i class="fa-solid fa-plus-circle">
